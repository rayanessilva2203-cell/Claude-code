<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111}
.s{position:relative;width:1080px;height:1920px;overflow:hidden;background-size:cover;background-position:center}
.shade{position:absolute;left:0;right:0;pointer-events:none}
.top{top:0;height:900px;background:linear-gradient(rgba(40,28,30,.55),rgba(40,28,30,.25) 55%,rgba(0,0,0,0))}
.bot{bottom:0;height:1000px;background:linear-gradient(rgba(0,0,0,0),rgba(40,28,30,.35) 40%,rgba(40,28,30,.72))}
.micro{position:absolute;top:120px;left:60px;right:60px;display:flex;justify-content:space-between;font:500 20px Montserrat;letter-spacing:.32em;color:#fff;opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.micro b{font-family:'Playfair Display';font-style:italic;font-weight:600;letter-spacing:.02em;font-size:26px;margin-top:-5px}
.blk{position:absolute;left:0;right:0;text-align:center}
.script{font:110px 'Great Vibes';color:#fff;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.45)}
.disp{font:700 150px Fredoka;color:#F6EFA6;line-height:.9;letter-spacing:-.01em;text-shadow:0 6px 24px rgba(60,30,30,.45);margin-top:-14px}
.disp.m{font-size:118px}
.tag{display:inline-block;margin-top:34px;background:#D65DB1;color:#fff;font:500 46px Montserrat;padding:14px 34px 18px;outline:3px dashed #fff;outline-offset:-11px;transform:rotate(-3deg);box-shadow:0 10px 28px rgba(80,20,60,.35)}
.tag u{font-weight:700;text-decoration-thickness:4px;text-underline-offset:7px}
.imp{margin-top:34px;font:800 52px Montserrat;color:#F6EFA6;text-decoration:underline;text-decoration-thickness:5px;text-underline-offset:10px;text-shadow:0 3px 14px rgba(0,0,0,.45)}
.deco{position:absolute;font-size:56px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
.star{position:absolute;width:60px;height:60px}
.star path{fill:#fff}
.cta{display:inline-flex;align-items:center;gap:18px;margin-top:40px;background:#fff;color:#3a2a2e;font:700 40px Montserrat;padding:24px 44px;border-radius:60px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cta span{color:#D65DB1}
.chip{position:absolute;background:rgba(255,255,255,.92);color:#3a2a2e;font:600 36px Montserrat;padding:18px 30px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.chip i{font-style:normal;color:#D65DB1}
.e{height:1em;width:1em;vertical-align:-.14em;display:inline-block}
.em{position:absolute;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
</style></head><body>
